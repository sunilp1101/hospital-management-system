{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white text-center p-1">
            <h5>
                {% if form.instance.pk %}
                    Update Medicine
                {% else %}
                    Add Medicine
                {% endif %}
            </h5>
        </div>

        <div class="card-body">
           <div class="alert alert-info">
               <strong>Patient ID:</strong> {{ patient.id }}<br>
               <strong>Patient Name:</strong> {{ patient.patient_name }}
           </div>
            <form method="POST">
                {% csrf_token %}
                <div class="table-responsive">

                        <table class="table table-hover table-bordered align-middle text-center">

                            <thead class="table-dark">
                                <tr>
                                    <th>Drug</th>
                                    <th>Quantity</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr>
                                    <th>{{ form.drug}} </th>
                                    <th>{{ form.quantity }}</th>
                                </tr>
                            </tbody>
                        </table>
                </div>

                <div class="text-center mt-3">
                    <button type="submit" class="btn btn-success">Save</button>

                    <a href="{% url 'patient_medicine_list' patient.id %}" class="btn btn-secondary">Back</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
